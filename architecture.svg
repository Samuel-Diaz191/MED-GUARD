<svg width="1500" height="920" viewBox="0 0 1500 920" xmlns="http://www.w3.org/2000/svg" role="img">
<title>MedGuard system architecture</title>
<desc>ESP32-S3 dual-core architecture: Core 1 runs the real-time ECG pipeline (producer, consumer, coordinator, alert responder) connected by a queue, event group, and direct task notifications, with a manual patient-alert button ISR and a red alarm LED. Core 0 runs the observability plane (serial or web monitor) which reads pipeline state without locks and drives a blue heartbeat LED.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="1500" height="920" fill="#ffffff"/>

<text x="750" y="34" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827">MedGuard — System Architecture</text>
<text x="750" y="54" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6B7280">ESP32-S3 · dual-core FreeRTOS · EEL 4775 Real-Time Systems Final Capstone</text>

<!-- Outer chip boundary -->
<rect x="40" y="80" width="1420" height="800" rx="16" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="70" y="105" font-family="sans-serif" font-size="12" font-weight="700" fill="#6B7280">ESP32-S3-WROOM-1</text>

<!-- CORE 1 PANEL -->
<rect x="70" y="130" width="660" height="720" rx="12" fill="#F3E8FF" fill-opacity="0.35" stroke="#6B21A8" stroke-width="1.5"/>
<text x="90" y="160" font-family="sans-serif" font-size="15" font-weight="700" fill="#4C1D95">Core 1 — Real-Time Plane</text>
<text x="90" y="178" font-family="sans-serif" font-size="10.5" fill="#6B21A8">All four pipeline tasks pinned here, isolated from monitoring load</text>

<!-- ecg_sample_task -->
<rect x="100" y="200" width="230" height="60" rx="8" fill="#6B21A8"/>
<text x="215" y="224" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">ecg_sample_task</text>
<text x="215" y="241" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#E9D5FF">producer · prio 8 · 20 Hz</text>
<text x="215" y="254" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#E9D5FF">WCET tracked (App 2 fold-in)</text>

<!-- data_q -->
<rect x="380" y="200" width="180" height="60" rx="8" fill="#111827"/>
<text x="470" y="224" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">data_q</text>
<text x="470" y="241" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#D1D5DB">Queue · depth 8</text>
<text x="470" y="254" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#D1D5DB">drop-oldest back-pressure</text>

<line x1="330" y1="230" x2="378" y2="230" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- arrhythmia_decision_task -->
<rect x="100" y="300" width="230" height="60" rx="8" fill="#6B21A8"/>
<text x="215" y="324" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">arrhythmia_decision_task</text>
<text x="215" y="341" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#E9D5FF">consumer · prio 8</text>
<text x="215" y="354" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#E9D5FF">WCET tracked (App 2 fold-in)</text>

<line x1="470" y1="260" x2="470" y2="285" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="470" y1="285" x2="215" y2="285" stroke="#374151" stroke-width="1.5"/>
<line x1="215" y1="285" x2="215" y2="298" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="345" y="278" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#111827">xQueueReceive(200ms)</text>

<!-- evt_group -->
<rect x="380" y="300" width="180" height="60" rx="8" fill="#111827"/>
<text x="470" y="324" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">evt_group</text>
<text x="470" y="341" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#D1D5DB">Event Group</text>
<text x="470" y="354" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#D1D5DB">PRODUCED | PROCESSED</text>

<line x1="330" y1="230" x2="470" y2="230" stroke="#374151" stroke-width="1.5"/>
<line x1="470" y1="230" x2="470" y2="298" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="330" y1="330" x2="378" y2="330" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600" y="270" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6B7280">SetBits</text>

<!-- cycle_coordinator_task -->
<rect x="100" y="400" width="230" height="60" rx="8" fill="#6B21A8"/>
<text x="215" y="424" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">cycle_coordinator_task</text>
<text x="215" y="441" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#E9D5FF">rendezvous · prio 9</text>
<text x="215" y="454" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#E9D5FF">WCET tracked (App 2 fold-in)</text>

<line x1="470" y1="360" x2="470" y2="385" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="470" y1="385" x2="215" y2="385" stroke="#374151" stroke-width="1.5"/>
<line x1="215" y1="385" x2="215" y2="398" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="345" y="378" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#111827">xEventGroupWaitBits(ALL)</text>

<!-- alert_task -->
<rect x="100" y="500" width="230" height="70" rx="8" fill="#6B21A8"/>
<text x="215" y="524" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">alert_task</text>
<text x="215" y="541" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#E9D5FF">responder · prio 12</text>
<text x="215" y="554" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#E9D5FF">WCET tracked · drives red LED</text>
<text x="215" y="566" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#E9D5FF">(pulse kept outside WCET timing)</text>

<line x1="215" y1="460" x2="215" y2="498" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="235" y="483" font-family="monospace" font-size="9.5" fill="#111827">xTaskNotifyGive</text>

<!-- Button ISR -->
<rect x="440" y="500" width="180" height="70" rx="8" fill="#B45309"/>
<text x="530" y="524" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">button_isr</text>
<text x="530" y="541" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#FEF3C7">PATIENT ALERT · GPIO 18</text>
<text x="530" y="556" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#FEF3C7">bypasses queue/event group</text>

<line x1="440" y1="530" x2="335" y2="530" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text x="385" y="522" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#92400E">notify (fastest path)</text>

<!-- Red LED -->
<circle cx="670" cy="535" r="20" fill="#FBE4E1" stroke="#C0392B" stroke-width="2"/>
<text x="670" y="540" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#C0392B">LED</text>
<text x="670" y="568" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#111827">Red · GPIO 4</text>
<text x="670" y="580" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#6B7280">pulses on alert</text>
<path d="M 215 570 L 215 592 L 670 592 L 670 557" fill="none" stroke="#C0392B" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- benchmark note -->
<rect x="100" y="600" width="560" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
<text x="380" y="622" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#78350F">Latency benchmark (ported from App 3)</text>
<text x="380" y="638" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#92400E">bench_sem + bench_notif_handle fire from the same button ISR instant —</text>
<text x="380" y="651" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#92400E">head-to-head measured comparison of the two wake-up primitives</text>

<!-- CORE 0 PANEL -->
<rect x="770" y="130" width="660" height="720" rx="12" fill="#EAF6F3" fill-opacity="0.5" stroke="#0B6E63" stroke-width="1.5"/>
<text x="790" y="160" font-family="sans-serif" font-size="15" font-weight="700" fill="#0B6E63">Core 0 — Observability Plane</text>
<text x="790" y="178" font-family="sans-serif" font-size="10.5" fill="#0B6E63">Monitoring/networking isolated from real-time work (see README §6)</text>

<!-- serial monitor -->
<rect x="800" y="200" width="280" height="70" rx="8" fill="#0B6E63"/>
<text x="940" y="224" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">serial_monitor_task</text>
<text x="940" y="241" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#D1FAE5">USE_WEBSERVER = 0 (default) · prio 4</text>
<text x="940" y="255" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#D1FAE5">prints WCET table, drives blue LED</text>

<!-- web monitor -->
<rect x="1120" y="200" width="280" height="70" rx="8" fill="#0B6E63" fill-opacity="0.55"/>
<text x="1260" y="224" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">webmonitor_task</text>
<text x="1260" y="241" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#D1FAE5">USE_WEBSERVER = 1 (optional) · prio 4</text>
<text x="1260" y="255" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#D1FAE5">Wi-Fi STA + HTTP (adapted from App 1)</text>

<text x="1080" y="240" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#6B7280">/</text>

<!-- Blue LED -->
<circle cx="940" cy="330" r="22" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="940" y="335" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#1D4ED8">LED</text>
<text x="940" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#111827">Blue · GPIO 2</text>
<text x="940" y="378" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6B7280">pulses every WCET print (heartbeat)</text>
<line x1="940" y1="270" x2="940" y2="308" stroke="#1D4ED8" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Cross-core read arrows -->
<rect x="800" y="420" width="600" height="140" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3"/>
<text x="1100" y="443" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#374151">Read without locks (single 32-bit reads are atomic on Xtensa)</text>
<text x="1100" y="465" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4B5563">uxQueueMessagesWaiting(data_q) · xEventGroupGetBits(evt_group)</text>
<text x="1100" y="483" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4B5563">hb_prod / hb_cons / hb_coord / hb_resp</text>
<text x="1100" y="501" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4B5563">wcet_*_max_us / wcet_*_total_us / wcet_*_count</text>
<text x="1100" y="519" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4B5563">last_item, last_sample_arrhythmia, dropped_samples</text>
<text x="1100" y="545" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#6B7280">Core 0 only ever reads this state — it never signals back into the Core 1 pipeline</text>

<line x1="770" y1="490" x2="700" y2="490" stroke="#374151" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="735" y="482" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#4B5563">reads</text>

<!-- key -->
<rect x="800" y="600" width="600" height="130" rx="8" fill="#ffffff" stroke="#D1D5DB" stroke-width="1"/>
<text x="820" y="624" font-family="sans-serif" font-size="11" font-weight="700" fill="#111827">Key design decisions</text>
<text x="820" y="646" font-family="sans-serif" font-size="10" fill="#374151">• Core separation: monitoring/network load can never delay the real-time pipeline</text>
<text x="820" y="666" font-family="sans-serif" font-size="10" fill="#374151">• Queue = typed data between 1 producer / 1 consumer</text>
<text x="820" y="686" font-family="sans-serif" font-size="10" fill="#374151">• Event group = multi-condition rendezvous (both bits, not just one)</text>
<text x="820" y="706" font-family="sans-serif" font-size="10" fill="#374151">• Direct notification = fastest 1-to-1 signal, used on the critical alert path</text>

<text x="750" y="900" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9CA3AF">MedGuard · EEL 4775 Real-Time Systems Final Capstone · System Architecture Diagram</text>

</svg>
